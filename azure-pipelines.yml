trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '03b7b0f5-01f4-4849-b4c9-7d7ef9b82650'
  imageRepository: 'yashgautamcodealphaazurecicd'
  containerRegistry: 'codealphacontainer01.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  azureSubscription: 'CodeAlpha-Azure-Connection'
  appName: 'codealpha-cicd-app-2026'

pool:
  name: 'CodeAlpha-SelfHosted'

stages:

- stage: Build
  displayName: Build and push stage

  jobs:
  - job: Build
    displayName: Build

    steps:

    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)


- stage: Deploy
  displayName: Deploy to Azure App Service

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: Deploy container

    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Docker image to Azure App Service
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(appName)
        containers: $(containerRegistry)/$(imageRepository):$(tag)
